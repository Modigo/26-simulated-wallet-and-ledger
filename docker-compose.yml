services:
  db:
    image: postgres:16-alpine
    environment: {POSTGRES_USER: ledgerlab, POSTGRES_PASSWORD: ledgerlab, POSTGRES_DB: ledgerlab}
    ports: ["5432:5432"]
    volumes: [ledgerlab_db:/var/lib/postgresql/data]
    healthcheck: {test: ["CMD-SHELL","pg_isready -U ledgerlab"], interval: 5s, timeout: 5s, retries: 10}
  backend:
    build: ./backend
    environment: {DATABASE_URL: "postgresql+psycopg://ledgerlab:ledgerlab@db:5432/ledgerlab", SESSION_SECRET: "[SECURITY_DATA]", CORS_ORIGINS: "http://localhost:3000", COOKIE_SECURE: "false"}
    ports: ["8000:8000"]
    depends_on: {db: {condition: service_healthy}}
  frontend:
    build: ./frontend
    environment: {BACKEND_INTERNAL_URL: "http://backend:8000"}
    ports: ["3000:3000"]
    depends_on: [backend]
volumes: {ledgerlab_db: {}}
